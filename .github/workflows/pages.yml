name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - name: Prepare site
      run: mkdir -p _site && cp web/index.html _site/index.html
    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site
    - uses: actions/deploy-pages@v4
      id: deployment
