name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-modern:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y ninja-build
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCI=ON -DCMAKE_CXX_FLAGS="-march=x86-64-v3 -mtune=generic"
    - name: Build
      run: cmake --build build --config Release
    - name: Run Bench
      run: ./build/luminex bench
    - name: Test UCI
      run: printf 'uci\nisready\nquit\n' | ./build/luminex

  linux-compat:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y ninja-build
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCI=ON -DCMAKE_CXX_FLAGS="-march=x86-64 -mtune=generic -msse4.2 -mpopcnt"
    - name: Build
      run: cmake --build build --config Release
    - name: Run Bench
      run: ./build/luminex bench
    - name: Test UCI
      run: printf 'uci\nisready\nquit\n' | ./build/luminex

  windows-modern:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -T ClangCL
    - name: Build
      run: cmake --build build --config Release
    - name: Run Bench
      run: build\Release\luminex.exe bench
    - name: Test UCI
      run: |
        (echo uci & echo isready & echo quit) | build\Release\luminex.exe

  windows-compat:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -B build -G "Visual Studio 17 2022" -A x64
    - name: Build
      run: cmake --build build --config Release
    - name: Run Bench
      run: build\Release\luminex.exe bench
    - name: Test UCI
      run: |
        (echo uci & echo isready & echo quit) | build\Release\luminex.exe

  macos-arm64:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: brew install ninja
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: cmake --build build --config Release
    - name: Run Bench
      run: ./build/luminex bench
    - name: Test UCI
      run: printf 'uci\nisready\nquit\n' | ./build/luminex
