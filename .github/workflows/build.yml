name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Every build carries the shipped network (fetch-net.sh pins the file) and
# must evaluate with it when run by itself from an empty directory
# (check-net.sh), as the release binaries are, and need no more from the
# system than the release notes say (check-deps.py). Every build also names itself
# after the development build (meta) and keeps its binary as an artifact; on
# main, dev-release publishes them as the rolling luminex-dev pre-release.
#
# The x86-64 binaries are universal (CMake LUMINEX_DISPATCH): one per OS,
# carrying the network kernels of every instruction-set level and running the
# best one the CPU supports. check-simd.sh runs their nnuecheck, which fails
# unless every level evaluates a fixed set of games alike, on the runner's CPU
# and, under Intel SDE (fetch-sde.sh), as the CPUs that have the levels the
# runner lacks; simd-digests then checks that both binaries and the build
# OpenBench runs (the makefile job) evaluate those games alike too.
jobs:
  # The development build every job builds: dev-<commit date, UTC>-<the
  # commit's first 8 hex digits>, as in dev-20261112-d4774f1a.
  meta:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.id.outputs.build_id }}
    steps:
    - uses: actions/checkout@v5
    - id: id
      run: echo "build_id=dev-$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d HEAD)-$(git rev-parse HEAD | cut -c1-8)" >> "$GITHUB_OUTPUT"

  # Ubuntu 22.04 with libstdc++ and libgcc linked in, so the binary runs on
  # glibc 2.35 and newer. gcc-13 from the toolchain PPA.
  linux:
    needs: meta
    runs-on: ubuntu-22.04
    outputs:
      digest: ${{ steps.simd.outputs.digest }}
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update && sudo apt-get install -y ninja-build g++-13
    - name: Fetch the network
      run: bash .github/scripts/fetch-net.sh
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCI=ON -DCMAKE_CXX_COMPILER=g++-13 -DLUMINEX_DISPATCH=ON -DCMAKE_CXX_FLAGS="-static-libstdc++ -static-libgcc" -DLUMINEX_EMBED_PINNED=ON -DLUMINEX_BUILD_ID=${{ needs.meta.outputs.build_id }}
    - name: Build
      run: cmake --build build --config Release
    - name: Check instruction set
      run: bash .github/scripts/check-isa.sh build/luminex universal
    - name: Run Bench
      run: ./build/luminex bench
    - name: Check the built-in network
      run: bash .github/scripts/check-net.sh build/luminex
    - name: Check the engine name
      run: bash .github/scripts/check-name.sh build/luminex ${{ needs.meta.outputs.build_id }}
    - name: Check the kernel levels agree
      id: simd
      run: bash .github/scripts/check-simd.sh build/luminex
    # Each SDE chip is a CPU with a different set of levels: Sapphire Rapids
    # has them all, Ice Lake no AVX-VNNI, Skylake-SP no VNNI at all, Arrow
    # Lake (CCI's Core Ultra 7 265T) no AVX-512, Haswell AVX2 alone, Sandy
    # Bridge AVX without AVX2, Nehalem no AVX. On each the binary must find
    # exactly those levels, run nothing the chip lacks, and print the digest
    # of the native run.
    - name: Check the kernel levels on other CPUs (Intel SDE)
      env:
        DIGEST: ${{ steps.simd.outputs.digest }}
      run: |
        SDE=$(bash .github/scripts/fetch-sde.sh)
        export SDE
        check() { bash .github/scripts/check-simd.sh build/luminex "$@"; }
        check spr "avx512vnni avx512 avxvnni avx2 base"
        check icx "avx512vnni avx512 avx2 base"
        check skx "avx512 avx2 base"
        check arl "avxvnni avx2 base"
        check hsw "avx2 base"
        check snb "base"
        check nhm "base"
    - name: Package
      run: |
        strip build/luminex
        mv build/luminex luminex-linux-x86-64
    - name: Check what it needs from the system
      shell: bash
      run: |
        py=python3; [ "$RUNNER_OS" = Windows ] && py=python
        "$py" .github/scripts/check-deps.py luminex-linux-x86-64 luminex-linux-x86-64
    - uses: actions/upload-artifact@v4
      with:
        name: luminex-linux-x86-64
        path: luminex-linux-x86-64
        retention-days: 14

  windows:
    needs: meta
    runs-on: windows-2022  # pin: windows-latest image no longer exposes a VS instance to cmake
    outputs:
      digest: ${{ steps.simd.outputs.digest }}
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v5
    - name: Fetch the network
      shell: bash
      run: bash .github/scripts/fetch-net.sh
    - name: Configure
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -T ClangCL -DLUMINEX_DISPATCH=ON -DLUMINEX_EMBED_PINNED=ON -DLUMINEX_BUILD_ID=${{ needs.meta.outputs.build_id }}
    - name: Build
      run: cmake --build build --config Release
    - name: Check instruction set
      shell: bash
      run: bash .github/scripts/check-isa.sh build/Release/luminex.exe universal
    - name: Run Bench
      run: build\Release\luminex.exe bench
    - name: Check the built-in network
      shell: bash
      run: bash .github/scripts/check-net.sh build/Release/luminex.exe
    - name: Check the engine name
      shell: bash
      run: bash .github/scripts/check-name.sh build/Release/luminex.exe ${{ needs.meta.outputs.build_id }}
    - name: Check the kernel levels agree
      id: simd
      shell: bash
      run: bash .github/scripts/check-simd.sh build/Release/luminex.exe
    - name: Check the kernel levels on other CPUs (Intel SDE)
      shell: bash
      env:
        DIGEST: ${{ steps.simd.outputs.digest }}
      run: |
        SDE=$(bash .github/scripts/fetch-sde.sh)
        export SDE
        check() { bash .github/scripts/check-simd.sh build/Release/luminex.exe "$@"; }
        check spr "avx512vnni avx512 avxvnni avx2 base"
        check arl "avxvnni avx2 base"
        check nhm "base"
    - name: Package
      shell: bash
      run: mv build/Release/luminex.exe luminex-windows-x86-64.exe
    - name: Check what it needs from the system
      shell: bash
      run: |
        py=python3; [ "$RUNNER_OS" = Windows ] && py=python
        "$py" .github/scripts/check-deps.py luminex-windows-x86-64.exe luminex-windows-x86-64.exe
    - uses: actions/upload-artifact@v4
      with:
        name: luminex-windows-x86-64
        path: luminex-windows-x86-64.exe
        retention-days: 14

  macos-arm64:
    needs: meta
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: brew install ninja
    - name: Fetch the network
      run: bash .github/scripts/fetch-net.sh
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUMINEX_EMBED_PINNED=ON -DLUMINEX_BUILD_ID=${{ needs.meta.outputs.build_id }}
    - name: Build
      run: cmake --build build --config Release
    - name: Check instruction set
      run: bash .github/scripts/check-isa.sh build/luminex dotprod
    - name: Run Bench
      run: ./build/luminex bench
    - name: Check the built-in network
      run: bash .github/scripts/check-net.sh build/luminex
    - name: Check the engine name
      run: bash .github/scripts/check-name.sh build/luminex ${{ needs.meta.outputs.build_id }}
    - name: Check the kernels run
      run: bash .github/scripts/check-simd.sh build/luminex
    - name: Package
      run: |
        strip build/luminex
        mv build/luminex luminex-macos-arm64
    - name: Check what it needs from the system
      shell: bash
      run: |
        py=python3; [ "$RUNNER_OS" = Windows ] && py=python
        "$py" .github/scripts/check-deps.py luminex-macos-arm64 luminex-macos-arm64
    - uses: actions/upload-artifact@v4
      with:
        name: luminex-macos-arm64
        path: luminex-macos-arm64
        retention-days: 14

  # The build OpenBench's workers run: the Makefile, which runs CMake with no
  # network inside, its kernels compiled for the worker's CPU, and leaves
  # NNUEFile to the client. The other jobs build through CMake directly, so
  # this path was the untested one; this job builds it, checks the bench, that
  # NNUEFile's default is the pinned network's real name, and its nnuecheck
  # digest, which simd-digests compares with the release binaries'.
  makefile:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.simd.outputs.digest }}
    steps:
    - uses: actions/checkout@v5
    - name: Build as OpenBench does
      run: make -j EXE=luminex
    - name: Run Bench
      run: ./luminex bench
    - name: Check the default network name
      run: bash .github/scripts/check-net.sh --no-embed ./luminex
    - name: Fetch the network
      run: bash .github/scripts/fetch-net.sh
    - name: Check the kernels' evaluations
      id: simd
      run: |
        bash .github/scripts/check-simd.sh ./luminex --net "net/$(sed -n 's#^url=.*/##p' .github/scripts/fetch-net.sh)"
    # The negative control of the SDE checks in the linux and windows jobs:
    # this build's kernels are compiled for the runner's CPU (AVX2 at least),
    # so as Sandy Bridge, which has no AVX2, SDE's chip check must stop it.
    - name: Check that SDE stops instructions the emulated CPU lacks
      run: |
        SDE=$(bash .github/scripts/fetch-sde.sh)
        net="net/$(sed -n 's#^url=.*/##p' .github/scripts/fetch-net.sh)"
        if out=$("$SDE" -snb -chip-check-exe-only -- ./luminex nnuecheck "$net" 2>&1); then
          printf '%s\n' "$out" | tail -5
          echo "SDE ran a build for this CPU as Sandy Bridge and did not stop it" >&2
          exit 1
        fi
        printf '%s\n' "$out" | grep -m1 -i "sde-error\|not valid for specified chip"

  # The universal binaries and OpenBench's build compute the same evaluations:
  # one digest, whatever compiler, OS and instruction-set level.
  simd-digests:
    needs: [linux, windows, makefile]
    runs-on: ubuntu-latest
    steps:
    - name: Compare the nnuecheck digests
      env:
        LINUX: ${{ needs.linux.outputs.digest }}
        WINDOWS: ${{ needs.windows.outputs.digest }}
        MAKEFILE: ${{ needs.makefile.outputs.digest }}
      run: |
        echo "linux $LINUX, windows $WINDOWS, makefile (OpenBench's build) $MAKEFILE"
        [ -n "$LINUX" ] && [ "$LINUX" = "$WINDOWS" ] && [ "$LINUX" = "$MAKEFILE" ]

  # The rolling development build, as Stockfish publishes one: a push to main
  # that passes every job above becomes the pre-release
  # luminex-dev-YYYYMMDD-<sha8>, with the binaries those jobs built and
  # tested, and the previous luminex-dev release and its tag are deleted
  # (dev-release.sh). The v* releases and engine-archives (OpenBench's store
  # of old builds and networks) never match the pattern it deletes. Runs on
  # main queue one at a time; elsewhere (pull requests, other branches) the
  # script runs dry and only prints what it would do.
  dev-release:
    needs: [meta, linux, windows, macos-arm64, makefile, simd-digests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read  # the notes link each commit to its pull request
    concurrency:
      group: dev-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: luminex-*
        merge-multiple: true
    - name: Fetch the network
      run: bash .github/scripts/fetch-net.sh dist
    - name: Publish the development build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BUILD_ID: ${{ needs.meta.outputs.build_id }}
        DRY_RUN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && '0' || '1' }}
      run: bash .github/scripts/dev-release.sh dist
