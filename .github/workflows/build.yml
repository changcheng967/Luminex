name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-modern:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y ninja-build
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCI=ON -DCMAKE_CXX_COMPILER=g++-14 -DLUMINEX_MARCH=x86-64-v3
    - name: Build
      run: cmake --build build --config Release
    - name: Check instruction set
      run: bash .github/scripts/check-isa.sh build/luminex avx2
    - name: Run Bench
      run: ./build/luminex bench
    - name: Test UCI
      run: printf 'uci\nisready\nquit\n' | ./build/luminex

  linux-compat:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y ninja-build
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCI=ON -DCMAKE_CXX_COMPILER=g++-14 -DLUMINEX_MARCH=x86-64-v2
    - name: Build
      run: cmake --build build --config Release
    - name: Check instruction set
      run: bash .github/scripts/check-isa.sh build/luminex baseline
    - name: Run Bench
      run: ./build/luminex bench
    - name: Test UCI
      run: printf 'uci\nisready\nquit\n' | ./build/luminex

  # glibc-2.35 build for older hosts (DCU pods, Ubuntu 22.04). gcc-13 ships on
  # the 22.04 runner image; static libstdc++/libgcc so no GLIBCXX_3.4.3x is
  # needed at runtime. Same source, both march levels, artifacts attached.
  linux-legacy:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - suffix: linux-x86-64-glibc235-modern
            march: x86-64-v3
            level: avx2
          - suffix: linux-x86-64-glibc235
            march: x86-64-v2
            level: baseline
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update && sudo apt-get install -y ninja-build g++-13
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCI=ON -DCMAKE_CXX_COMPILER=g++-13 -DLUMINEX_MARCH=${{ matrix.march }} -DCMAKE_CXX_FLAGS="-static-libstdc++ -static-libgcc"
    - name: Build
      run: cmake --build build --config Release
    - name: Check instruction set
      run: bash .github/scripts/check-isa.sh build/luminex ${{ matrix.level }}
    - name: Run Bench
      run: ./build/luminex bench
    - name: Test UCI
      run: printf 'uci\nisready\nquit\n' | ./build/luminex
    - uses: actions/upload-artifact@v4
      with:
        name: luminex-${{ matrix.suffix }}
        path: build/luminex


  windows-modern:
    runs-on: windows-2022  # pin: windows-latest image no longer exposes a VS instance to cmake
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v5
    - name: Configure
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -T ClangCL -DLUMINEX_MSVC_ARCH=AVX2
    - name: Build
      run: cmake --build build --config Release
    - name: Check instruction set
      shell: bash
      run: bash .github/scripts/check-isa.sh build/Release/luminex.exe avx2
    - name: Run Bench
      run: build\Release\luminex.exe bench
    - name: Test UCI
      run: |
        (echo uci & echo isready & echo quit) | build\Release\luminex.exe

  windows-compat:
    runs-on: windows-2022  # pin: windows-latest image no longer exposes a VS instance to cmake
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v5
    - name: Configure
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DLUMINEX_MSVC_ARCH=SSE2
    - name: Build
      run: cmake --build build --config Release
    - name: Check instruction set
      shell: bash
      run: bash .github/scripts/check-isa.sh build/Release/luminex.exe baseline
    - name: Run Bench
      run: build\Release\luminex.exe bench
    - name: Test UCI
      run: |
        (echo uci & echo isready & echo quit) | build\Release\luminex.exe

  macos-arm64:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: brew install ninja
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: cmake --build build --config Release
    - name: Report instruction set
      run: echo "NEON dot-product instructions (sdot) in the network code - $(objdump -d --no-show-raw-insn build/luminex | grep -c sdot || true)"
    - name: Run Bench
      run: ./build/luminex bench
    - name: Test UCI
      run: printf 'uci\nisready\nquit\n' | ./build/luminex
