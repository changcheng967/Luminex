name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ubuntu-clang:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y ninja-build clang
    - name: Build
      run: |
        cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
        cmake --build build
    - name: Test
      run: echo -e "uci\nisready\nquit" | ./build/luminex

  ubuntu-gcc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build gcc-11 g++-11 cmake
    - name: Build
      run: |
        cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-11 -DCMAKE_C_COMPILER=gcc-11
        cmake --build build
    - name: Test
      run: echo -e "uci\nisready\nquit" | ./build/luminex

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v4
    - name: Install Ninja
      run: choco install ninja
    - name: Build
      run: |
        cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
        cmake --build build
    - name: Test
      run: |
        echo. > test_input.txt
        echo uci >> test_input.txt
        echo isready >> test_input.txt
        echo quit >> test_input.txt
        type test_input.txt | build\luminex.exe

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: brew install ninja cmake || true
    - name: Build
      run: |
        cmake -B build -G Ninja
        cmake --build build
    - name: Test
      run: echo -e "uci\nisready\nquit" | ./build/luminex
