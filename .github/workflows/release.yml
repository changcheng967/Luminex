name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v5.5.0)'
        required: true

# Every binary carries the shipped network (fetch-net.sh pins the file) and is
# checked to evaluate with it when run by itself (check-net.sh). The network
# is also attached on its own, for builds without it and for NNUEFile.
jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: modern
            cmake_flags: -DLUMINEX_MARCH=x86-64-v3
            level: avx2
            suffix: linux-x86-64-modern
          - arch: compat
            cmake_flags: -DLUMINEX_MARCH=x86-64-v2
            level: baseline
            suffix: linux-x86-64
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y ninja-build
    - name: Fetch the network
      run: bash .github/scripts/fetch-net.sh
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCI=ON ${{ matrix.cmake_flags }} -DLUMINEX_EMBED_NET=net/luminex_sfq_i8.nnue
    - name: Build
      run: cmake --build build --config Release
    - name: Check instruction set
      run: bash .github/scripts/check-isa.sh build/luminex ${{ matrix.level }}
    - name: Check the built-in network
      run: bash .github/scripts/check-net.sh build/luminex
    - name: Package
      run: |
        strip build/luminex
        chmod +x build/luminex
        mv build/luminex luminex-${{ matrix.suffix }}
    - uses: actions/upload-artifact@v4
      with:
        name: luminex-${{ matrix.suffix }}
        path: luminex-${{ matrix.suffix }}

  build-windows:
    runs-on: windows-2022  # pin: windows-latest image no longer exposes a VS instance to cmake
    # cmd, as in build.yml's Windows jobs, so CI runs these exact command
    # lines. PowerShell, the default, splits an unquoted argument such as
    # -DLUMINEX_EMBED_NET=net/luminex_sfq_i8.nnue at the dot.
    defaults:
      run:
        shell: cmd
    strategy:
      matrix:
        include:
          - arch: modern
            cmake_flags: -T ClangCL -DLUMINEX_MSVC_ARCH=AVX2
            level: avx2
            suffix: windows-x86-64-modern
          - arch: compat
            cmake_flags: -DLUMINEX_MSVC_ARCH=SSE2
            level: baseline
            suffix: windows-x86-64
    steps:
    - uses: actions/checkout@v5
    - name: Fetch the network
      shell: bash
      run: bash .github/scripts/fetch-net.sh
    - name: Configure
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 ${{ matrix.cmake_flags }} -DLUMINEX_EMBED_NET=net/luminex_sfq_i8.nnue
    - name: Build
      run: cmake --build build --config Release
    - name: Check instruction set
      shell: bash
      run: bash .github/scripts/check-isa.sh build/Release/luminex.exe ${{ matrix.level }}
    - name: Check the built-in network
      shell: bash
      run: bash .github/scripts/check-net.sh build/Release/luminex.exe
    - name: Package
      shell: bash
      run: mv build/Release/luminex.exe luminex-${{ matrix.suffix }}.exe
    - uses: actions/upload-artifact@v4
      with:
        name: luminex-${{ matrix.suffix }}
        path: luminex-${{ matrix.suffix }}.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: brew install ninja
    - name: Fetch the network
      run: bash .github/scripts/fetch-net.sh
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUMINEX_EMBED_NET=net/luminex_sfq_i8.nnue
    - name: Build
      run: cmake --build build --config Release
    - name: Check instruction set
      run: bash .github/scripts/check-isa.sh build/luminex dotprod
    - name: Check the built-in network
      run: bash .github/scripts/check-net.sh build/luminex
    - name: Package
      run: |
        strip build/luminex
        chmod +x build/luminex
        mv build/luminex luminex-macos-arm64
    - uses: actions/upload-artifact@v4
      with:
        name: luminex-macos-arm64
        path: luminex-macos-arm64

  upload-assets:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Fetch the network
      run: bash .github/scripts/fetch-net.sh
    - name: Upload binaries to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event.inputs.version || github.ref_name }}
      run: |
        if ! gh release view "$TAG" > /dev/null 2>&1; then
          echo "Creating release $TAG..."
          gh release create "$TAG" \
            --title "Luminex $TAG" \
            --notes "## Luminex $TAG" \
            --target "$GITHUB_SHA"
        fi
        gh release upload "$TAG" \
          artifacts/luminex-linux-x86-64-modern/luminex-linux-x86-64-modern \
          artifacts/luminex-linux-x86-64/luminex-linux-x86-64 \
          artifacts/luminex-windows-x86-64-modern/luminex-windows-x86-64-modern.exe \
          artifacts/luminex-windows-x86-64/luminex-windows-x86-64.exe \
          artifacts/luminex-macos-arm64/luminex-macos-arm64 \
          net/luminex_sfq_i8.nnue \
          --clobber
