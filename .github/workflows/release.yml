name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v5.5.0)'
        required: true

# Every binary carries the shipped network (fetch-net.sh pins the file) and is
# checked to evaluate with it when run by itself (check-net.sh), and to need
# no more from the system than the release notes' Needs column says
# (check-deps.py). The network is also attached on its own, for builds
# without it and for NNUEFile.
#
# One binary per platform. The x86-64 ones are universal (CMake
# LUMINEX_DISPATCH): they carry the network kernels of every instruction-set
# level and run the best one the CPU supports, and nnuecheck (check-simd.sh)
# fails the build unless every level the runner has evaluates alike. build.yml
# runs the same check under Intel SDE for the levels the runners lack.
jobs:
  # Ubuntu 22.04 with libstdc++ and libgcc linked in, so the binary runs on
  # glibc 2.35 and newer. gcc-13 from the toolchain PPA.
  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update && sudo apt-get install -y ninja-build g++-13
    - name: Fetch the network
      run: bash .github/scripts/fetch-net.sh
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCI=ON -DCMAKE_CXX_COMPILER=g++-13 -DLUMINEX_DISPATCH=ON -DCMAKE_CXX_FLAGS="-static-libstdc++ -static-libgcc" -DLUMINEX_EMBED_PINNED=ON
    - name: Build
      run: cmake --build build --config Release
    - name: Check instruction set
      run: bash .github/scripts/check-isa.sh build/luminex universal
    - name: Check the built-in network
      run: bash .github/scripts/check-net.sh build/luminex
    - name: Check the kernel levels agree
      run: bash .github/scripts/check-simd.sh build/luminex
    - name: Package
      run: |
        strip build/luminex
        chmod +x build/luminex
        mv build/luminex luminex-linux-x86-64
    - name: Check what it needs from the system
      shell: bash
      run: |
        py=python3; [ "$RUNNER_OS" = Windows ] && py=python
        "$py" .github/scripts/check-deps.py luminex-linux-x86-64 luminex-linux-x86-64
    - uses: actions/upload-artifact@v4
      with:
        name: luminex-linux-x86-64
        path: luminex-linux-x86-64

  build-windows:
    runs-on: windows-2022  # pin: windows-latest image no longer exposes a VS instance to cmake
    # cmd, as in build.yml's Windows jobs, so CI runs these exact command
    # lines. PowerShell, the default, splits an unquoted argument such as
    # -DLUMINEX_EMBED_NET=net/<file>.nnue at the dot.
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v5
    - name: Fetch the network
      shell: bash
      run: bash .github/scripts/fetch-net.sh
    - name: Configure
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -T ClangCL -DLUMINEX_DISPATCH=ON -DLUMINEX_EMBED_PINNED=ON
    - name: Build
      run: cmake --build build --config Release
    - name: Check instruction set
      shell: bash
      run: bash .github/scripts/check-isa.sh build/Release/luminex.exe universal
    - name: Check the built-in network
      shell: bash
      run: bash .github/scripts/check-net.sh build/Release/luminex.exe
    - name: Check the kernel levels agree
      shell: bash
      run: bash .github/scripts/check-simd.sh build/Release/luminex.exe
    - name: Package
      shell: bash
      run: mv build/Release/luminex.exe luminex-windows-x86-64.exe
    - name: Check what it needs from the system
      shell: bash
      run: |
        py=python3; [ "$RUNNER_OS" = Windows ] && py=python
        "$py" .github/scripts/check-deps.py luminex-windows-x86-64.exe luminex-windows-x86-64.exe
    - uses: actions/upload-artifact@v4
      with:
        name: luminex-windows-x86-64
        path: luminex-windows-x86-64.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: brew install ninja
    - name: Fetch the network
      run: bash .github/scripts/fetch-net.sh
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUMINEX_EMBED_PINNED=ON
    - name: Build
      run: cmake --build build --config Release
    - name: Check instruction set
      run: bash .github/scripts/check-isa.sh build/luminex dotprod
    - name: Check the built-in network
      run: bash .github/scripts/check-net.sh build/luminex
    - name: Package
      run: |
        strip build/luminex
        chmod +x build/luminex
        mv build/luminex luminex-macos-arm64
    - name: Check what it needs from the system
      shell: bash
      run: |
        py=python3; [ "$RUNNER_OS" = Windows ] && py=python
        "$py" .github/scripts/check-deps.py luminex-macos-arm64 luminex-macos-arm64
    - uses: actions/upload-artifact@v4
      with:
        name: luminex-macos-arm64
        path: luminex-macos-arm64

  upload-assets:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Fetch the network
      run: bash .github/scripts/fetch-net.sh
    - name: Upload binaries to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event.inputs.version || github.ref_name }}
      run: |
        if ! gh release view "$TAG" > /dev/null 2>&1; then
          echo "Creating release $TAG..."
          gh release create "$TAG" \
            --title "Luminex $TAG" \
            --notes "## Luminex $TAG" \
            --target "$GITHUB_SHA"
        fi
        # The network goes up under its real name, the pinned asset's file name
        # (fetch-net.sh saved it under that name), never under another one.
        net_name=$(sed -n 's#^url=.*/##p' .github/scripts/fetch-net.sh)
        [ -f "net/$net_name" ] || { echo "net/$net_name is missing"; exit 1; }
        gh release upload "$TAG" \
          artifacts/luminex-linux-x86-64/luminex-linux-x86-64 \
          artifacts/luminex-windows-x86-64/luminex-windows-x86-64.exe \
          artifacts/luminex-macos-arm64/luminex-macos-arm64 \
          "net/$net_name" \
          --clobber
