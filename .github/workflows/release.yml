name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v5.5.0)'
        required: true

# Every binary carries the shipped network (fetch-net.sh pins the file) and is
# checked to evaluate with it when run by itself (ci.sh net), and to need
# no more from the system than the release notes' Needs column says
# (ci.sh deps). The network is also attached on its own, for builds
# without it and for NNUEFile.
#
# One binary per platform. The x86-64 ones are universal (CMake
# LUMINEX_DISPATCH): they carry the network kernels of every instruction-set
# level and run the best one the CPU supports, and nnuecheck (ci.sh simd)
# fails the build unless every level the runner has evaluates alike. build.yml
# runs the same check under Intel SDE for the levels the runners lack.
jobs:
  # Ubuntu 22.04 with clang 23 and lld (no PIE, CMakeLists.txt), and LLVM's
  # libc++ and libc++abi linked in with libgcc, so the binary runs on glibc
  # 2.35 and newer. All from apt.llvm.org (ci.sh clang).
  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: bash .github/scripts/ci.sh clang install
    - name: Fetch the network
      run: bash .github/scripts/fetch-net.sh
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCI=ON -DCMAKE_CXX_COMPILER="$CXX" -DLUMINEX_DISPATCH=ON -DCMAKE_CXX_FLAGS="-stdlib=libc++" -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -static-libstdc++ -static-libgcc -Wl,-Bstatic -lc++abi -Wl,-Bdynamic" -DLUMINEX_EMBED_PINNED=ON
    - name: Check the compiler is clang 23
      run: bash .github/scripts/ci.sh clang check build
    - name: Build
      run: cmake --build build --config Release
    - name: Check instruction set
      run: bash .github/scripts/ci.sh isa build/luminex universal
    - name: Check the built-in network
      run: bash .github/scripts/ci.sh net build/luminex
    - name: Check the kernel levels agree
      run: bash .github/scripts/ci.sh simd build/luminex
    - name: Package
      run: |
        strip build/luminex
        chmod +x build/luminex
        mv build/luminex luminex-linux-x86-64
    - name: Check what it needs from the system
      shell: bash
      run: |
        bash .github/scripts/ci.sh deps luminex-linux-x86-64 luminex-linux-x86-64
    - uses: actions/upload-artifact@v4
      with:
        name: luminex-linux-x86-64
        path: luminex-linux-x86-64

  build-windows:
    runs-on: windows-2022  # pin: windows-latest image no longer exposes a VS instance to cmake
    # cmd, as in build.yml's Windows jobs, so CI runs these exact command
    # lines. PowerShell, the default, splits an unquoted argument such as
    # -DLUMINEX_EMBED_NET=net/<file>.nnue at the dot.
    defaults:
      run:
        shell: cmd
    steps:
    - uses: actions/checkout@v5
    # Visual Studio's ClangCL toolset with LLVM 23 in place of the LLVM that
    # Visual Studio bundles (ci.sh clang)
    - name: Install clang 23
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash .github/scripts/ci.sh clang install
    - name: Fetch the network
      shell: bash
      run: bash .github/scripts/fetch-net.sh
    - name: Configure
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -T ClangCL -DLUMINEX_DISPATCH=ON -DLUMINEX_EMBED_PINNED=ON
    - name: Check the compiler is clang 23
      shell: bash
      run: bash .github/scripts/ci.sh clang check build
    - name: Build
      run: cmake --build build --config Release
    - name: Check instruction set
      shell: bash
      run: bash .github/scripts/ci.sh isa build/Release/luminex.exe universal
    - name: Check the built-in network
      shell: bash
      run: bash .github/scripts/ci.sh net build/Release/luminex.exe
    - name: Check the kernel levels agree
      shell: bash
      run: bash .github/scripts/ci.sh simd build/Release/luminex.exe
    - name: Package
      shell: bash
      run: mv build/Release/luminex.exe luminex-windows-x86-64.exe
    - name: Check what it needs from the system
      shell: bash
      run: |
        bash .github/scripts/ci.sh deps luminex-windows-x86-64.exe luminex-windows-x86-64.exe
    - uses: actions/upload-artifact@v4
      with:
        name: luminex-windows-x86-64
        path: luminex-windows-x86-64.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5
    # Homebrew's LLVM 23 with the SDK's libc++ (ci.sh clang)
    - name: Install dependencies
      run: bash .github/scripts/ci.sh clang install
    - name: Fetch the network
      run: bash .github/scripts/fetch-net.sh
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_CXX_FLAGS="-nostdinc++ -isystem $LUMINEX_SDK/usr/include/c++/v1" -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" -DLUMINEX_EMBED_PINNED=ON
    - name: Check the compiler is clang 23
      run: bash .github/scripts/ci.sh clang check build
    - name: Build
      run: cmake --build build --config Release
    - name: Check instruction set
      run: bash .github/scripts/ci.sh isa build/luminex dotprod
    - name: Check the built-in network
      run: bash .github/scripts/ci.sh net build/luminex
    - name: Package
      run: |
        strip build/luminex
        chmod +x build/luminex
        mv build/luminex luminex-macos-arm64
    - name: Check what it needs from the system
      shell: bash
      run: |
        bash .github/scripts/ci.sh deps luminex-macos-arm64 luminex-macos-arm64
    - uses: actions/upload-artifact@v4
      with:
        name: luminex-macos-arm64
        path: luminex-macos-arm64

  upload-assets:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Fetch the network
      run: bash .github/scripts/fetch-net.sh
    - name: Upload binaries to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event.inputs.version || github.ref_name }}
      run: |
        if ! gh release view "$TAG" > /dev/null 2>&1; then
          echo "Creating release $TAG..."
          gh release create "$TAG" \
            --title "Luminex $TAG" \
            --notes "## Luminex $TAG" \
            --target "$GITHUB_SHA"
        fi
        # The network goes up under its real name, the pinned asset's file name
        # (fetch-net.sh saved it under that name), never under another one.
        net_name=$(sed -n 's#^url=.*/##p' .github/scripts/fetch-net.sh)
        [ -f "net/$net_name" ] || { echo "net/$net_name is missing"; exit 1; }
        gh release upload "$TAG" \
          artifacts/luminex-linux-x86-64/luminex-linux-x86-64 \
          artifacts/luminex-windows-x86-64/luminex-windows-x86-64.exe \
          artifacts/luminex-macos-arm64/luminex-macos-arm64 \
          "net/$net_name" \
          --clobber
