name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v5.5.0)'
        required: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: modern
            cmake_flags: -DCMAKE_CXX_FLAGS="-march=x86-64-v3 -mtune=generic"
            suffix: linux-x86-64-modern
          - arch: native
            cmake_flags: -DCMAKE_CXX_FLAGS="-march=x86-64 -mtune=generic -msse4.2 -mpopcnt"
            suffix: linux-x86-64
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y ninja-build
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCI=ON ${{ matrix.cmake_flags }}
    - name: Build
      run: cmake --build build --config Release
    - name: Test
      run: printf 'uci\nisready\nquit\n' | ./build/luminex
    - name: Package
      run: |
        strip build/luminex
        chmod +x build/luminex
        mv build/luminex luminex-${{ matrix.suffix }}
    - uses: actions/upload-artifact@v4
      with:
        name: luminex-${{ matrix.suffix }}
        path: luminex-${{ matrix.suffix }}

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: modern
            cmake_flags: -T ClangCL
            suffix: windows-x86-64-modern
          - arch: compat
            cmake_flags:
            suffix: windows-x86-64
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 ${{ matrix.cmake_flags }}
    - name: Build
      run: cmake --build build --config Release
    - name: Test
      shell: cmd /C {0}
      run: |
        (echo uci & echo isready & echo quit) | build\Release\luminex.exe
    - name: Package
      shell: bash
      run: mv build/Release/luminex.exe luminex-${{ matrix.suffix }}.exe
    - uses: actions/upload-artifact@v4
      with:
        name: luminex-${{ matrix.suffix }}
        path: luminex-${{ matrix.suffix }}.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: brew install ninja
    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
    - name: Build
      run: cmake --build build --config Release
    - name: Test
      run: printf 'uci\nisready\nquit\n' | ./build/luminex
    - name: Package
      run: |
        strip build/luminex
        chmod +x build/luminex
        mv build/luminex luminex-macos-arm64
    - uses: actions/upload-artifact@v4
      with:
        name: luminex-macos-arm64
        path: luminex-macos-arm64

  upload-assets:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Upload binaries to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event.inputs.version || github.ref_name }}
      run: |
        if ! gh release view "$TAG" > /dev/null 2>&1; then
          echo "ERROR: Release $TAG does not exist. Create it first with:"
          echo "  gh release create $TAG --title \"Luminex $TAG\" --notes \"...\""
          exit 1
        fi
        gh release upload "$TAG" \
          artifacts/luminex-linux-x86-64-modern/luminex-linux-x86-64-modern \
          artifacts/luminex-linux-x86-64/luminex-linux-x86-64 \
          artifacts/luminex-windows-x86-64-modern/luminex-windows-x86-64-modern.exe \
          artifacts/luminex-windows-x86-64/luminex-windows-x86-64.exe \
          artifacts/luminex-macos-arm64/luminex-macos-arm64 \
          --clobber
