name: Build Linux featurize
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build luminex-featurize
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake g++-13 libz-dev
          export CC=gcc-13 CXX=g++-13
          cmake -S . -B build -DBUILD_FEATURIZER=ON \
                -DCMAKE_EXE_LINKER_FLAGS="-static" > /dev/null
          cmake --build build -j4 --target luminex-featurize
          file build/luminex-featurize
          objdump -T build/luminex-featurize 2>/dev/null | grep -oE "GLIBCXX_[0-9.]+|GLIBC_[0-9.]+" | sort -uV | tail -4 || echo "fully static: no glibc symbol deps"
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: luminex-featurize-linux
          path: build/luminex-featurize
          retention-days: 30
